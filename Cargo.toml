[workspace]
resolver = "2"
members = ["crates/game-core", "crates/game-server", "crates/river-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The solver is exercised heavily by tests; keep debug test runs fast.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
