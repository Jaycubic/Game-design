<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2b17" />
    <meta name="description" content="Clearwater Run — a crew boat race to keep a river alive." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Clearwater Run</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="3D game view" tabindex="-1"></canvas>
      <div id="banner" role="status" hidden></div>
      <div id="ui"></div>
      <div id="run-ui"></div>
      <div id="modals"></div>
      <div id="toasts" aria-live="polite"></div>
      <div id="tooltip" role="tooltip" hidden></div>
      <div id="renderer" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
